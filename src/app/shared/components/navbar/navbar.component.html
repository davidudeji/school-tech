<nav class="navbar" [class.navbar-scrolled]="isScrolled()" aria-label="Main navigation">
  <div class="navbar-inner">

    <!-- Logo -->
    <a routerLink="/" class="navbar-logo" id="navbar-logo">
      <div class="logo-icon">ST</div>
      <div class="logo-text">
        <span class="logo-school">SCHOOL</span><span class="logo-tech">TECH</span>
        <span class="logo-tag">ERP</span>
      </div>
    </a>

    <!-- Desktop Nav Links -->
    <div class="navbar-links" role="menubar">
      @for (link of navLinks; track link.id) {
        <a [href]="link.href" class="nav-link" [class.nav-link-active]="activeLink() === link.id"
          (click)="setActive(link.id)" [id]="'nav-' + link.id" role="menuitem">
          {{ link.label }}
        </a>
      }
    </div>

    <!-- CTA Actions -->
    <div class="navbar-cta">
      <a routerLink="/login" class="btn-nav-ghost" id="nav-login-btn">Log in</a>
      <a routerLink="/register" class="btn-nav-primary" id="nav-get-started-btn">Get Started</a>

      <!-- Mobile Hamburger -->
      <button class="hamburger" (click)="toggleMenu()" [class.hamburger-open]="menuOpen()"
        aria-label="Toggle menu" id="nav-hamburger-btn">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>

  <!-- Mobile Menu -->
  @if (menuOpen()) {
    <div class="mobile-menu" role="menu">
      @for (link of navLinks; track link.id) {
        <a [href]="link.href" class="mobile-nav-link" (click)="closeMenu()" [id]="'mobile-nav-' + link.id" role="menuitem">
          {{ link.label }}
        </a>
      }
      <div class="mobile-menu-actions">
        <a routerLink="/login" class="btn-nav-ghost" (click)="closeMenu()" id="mobile-login-btn">Log in</a>
        <a routerLink="/register" class="btn-nav-primary" (click)="closeMenu()" id="mobile-register-btn">Get Started</a>
      </div>
    </div>
  }
</nav>
